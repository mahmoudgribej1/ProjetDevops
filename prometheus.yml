global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["192.168.50.4:9090"]

  - job_name: "jenkins"
    metrics_path: '/prometheus'  # Specify the metrics path here
    static_configs:
      - targets: ["192.168.50.4:8080"]

  - job_name: "node"
    static_configs:
      - targets: [ "192.168.50.4:9100" ]

  - job_name: "spring"
    metrics_path: '/prometheus'
    static_configs:
      - targets: ["192.168.50.4:8082"]