version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=my-secret-pw  # Set a secure root password
      - MYSQL_DATABASE=tp-foyer_db
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  app-tp-foyer:
    depends_on:
      mysqldb:
        condition: service_healthy  # Wait for MySQL to be healthy before starting
    image: sboui546/tp-foyer:5.0.0
    restart: on-failure
    ports:
      - 8082:8082
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url": "jdbc:mysql://mysqldb:3306/tp-foyer_db?createDatabaseIfNotExist=true",
        "spring.datasource.username": "root",
        "spring.datasource.password": "my-secret-pw",  # Include the password
        "spring.jpa.properties.hibernate.dialect": "org.hibernate.dialect.MYSQL5InnoDBDialect",
        "spring.jpa.hibernate.ddl-auto": "update"
      }'
    stdin_open: true
    tty: true
    networks:
      - app-network

volumes:
  db:

networks:
  app-network:
    driver: bridge